spring.application.name=user-service

server.port=${PORT:${USER_SERVICE_PORT:3001}}

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/userdb}
spring.mongodb.database=${MONGO_DATABASE:userdb}

# Also keep data prefix for compatibility
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/userdb}

spring.data.mongodb.auto-index-creation=true