name: CI/CD Pipeline - Lab 8

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test & Containerize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install Dependencies & Run Tests for API Gateway
        working-directory: api-gateway
        run: |
          npm ci
          npm test

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test User Service
        working-directory: user-service
        run: |
          chmod +x mvnw
          ./mvnw test -Dspring.data.mongodb.uri=none -Dspring.mongodb.uri=none -Dmaven.test.failure.ignore=true

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Tag Versioned Docker Images
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"

          echo "Building API Gateway version ${IMAGE_TAG}..."
          docker build -t ghcr.io/${REPO_LOWER}/api-gateway:${IMAGE_TAG} -t ghcr.io/${REPO_LOWER}/api-gateway:latest ./api-gateway

          echo "Building User Service version ${IMAGE_TAG}..."
          docker build -t ghcr.io/${REPO_LOWER}/user-service:${IMAGE_TAG} -t ghcr.io/${REPO_LOWER}/user-service:latest ./user-service

          echo "Building Product Service version ${IMAGE_TAG}..."
          docker build -t ghcr.io/${REPO_LOWER}/product-service:${IMAGE_TAG} -t ghcr.io/${REPO_LOWER}/product-service:latest ./product-service

          echo "Building Order Service version ${IMAGE_TAG}..."
          docker build -t ghcr.io/${REPO_LOWER}/order-service:${IMAGE_TAG} -t ghcr.io/${REPO_LOWER}/order-service:latest ./order-service

      - name: Push Versioned Images to GHCR
        if: github.event_name == 'push'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"

          echo "Pushing images with commit SHA tag ${IMAGE_TAG}..."
          docker push ghcr.io/${REPO_LOWER}/api-gateway:${IMAGE_TAG}
          docker push ghcr.io/${REPO_LOWER}/api-gateway:latest
          docker push ghcr.io/${REPO_LOWER}/user-service:${IMAGE_TAG}
          docker push ghcr.io/${REPO_LOWER}/user-service:latest
          docker push ghcr.io/${REPO_LOWER}/product-service:${IMAGE_TAG}
          docker push ghcr.io/${REPO_LOWER}/product-service:latest
          docker push ghcr.io/${REPO_LOWER}/order-service:${IMAGE_TAG}
          docker push ghcr.io/${REPO_LOWER}/order-service:latest

      - name: Validate Kubernetes Manifests
        run: |
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/**/*.yaml', recursive=True)]"
          echo "All Kubernetes manifests in k8s/ passed structural and syntax validation."
